[package]
name = "bigify"
description = "Bigify: a 10-foot, controller-first Spotify Connect client for Linux TVs and handhelds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "bigify"
path = "src/main.rs"

[features]
default = ["gamepad", "mpris"]
# Read game controllers directly (evdev via gilrs). Without it, Bigify still
# works with keyboards and Steam Input's keyboard mappings.
gamepad = ["dep:gilrs"]
# Media keys, desktop media widgets and playerctl via D-Bus (Linux only).
mpris = ["dep:mpris-server", "dep:tokio"]

[dependencies]
bigify-core.workspace = true
bigify-spotify.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
gilrs = { version = "0.11", optional = true }
mpris-server = { version = "0.10", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }

[build-dependencies]
cxx-qt-build = "0.10"
