name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build container
        run: docker build -t bigify-dev -f ci/Dockerfile .
      - name: Format
        run: ci/run.sh cargo fmt --all --check
      - name: Clippy
        run: ci/run.sh cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: ci/run.sh cargo test --workspace --locked
      - name: Render screens (smoke test of QML at runtime)
        run: |
          ci/run.sh cargo build -p bigify --locked
          for s in home nowPlaying search library settings queue; do
            ci/run.sh ci/screenshot.sh "$s" 1920x1080
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
